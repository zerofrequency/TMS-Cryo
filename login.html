<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMS Login</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --text: #17202b;
        --muted: #667386;
        --border: #d8dee8;
        --accent: #1468d8;
        --accent-dark: #0f55b4;
        --danger: #b42318;
        --shadow: 0 22px 60px rgba(22, 34, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(135deg, rgba(20, 104, 216, 0.08), transparent 42%),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .login-shell {
        width: min(100% - 32px, 420px);
      }

      .login-card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }

      .brand-mark {
        display: grid;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        place-items: center;
        background: var(--accent);
        color: #fff;
        font-weight: 850;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .subtitle {
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      form {
        display: grid;
        gap: 14px;
        margin-top: 24px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #2c3645;
        font-size: 13px;
        font-weight: 750;
      }

      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font: inherit;
        padding: 11px 12px;
      }

      input:focus {
        border-color: var(--accent);
        outline: 3px solid rgba(20, 104, 216, 0.15);
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 850;
      }

      button:hover {
        background: var(--accent-dark);
      }

      .error {
        display: none;
        margin-top: 16px;
        border: 1px solid rgba(180, 35, 24, 0.22);
        border-radius: 8px;
        background: rgba(180, 35, 24, 0.08);
        color: var(--danger);
        padding: 10px 12px;
        font-size: 13px;
      }

      .error:target {
        display: block;
      }

      .note {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="brand">
          <span class="brand-mark">TC</span>
          <div>
            <h1 id="loginTitle">TMS Login</h1>
            <p class="subtitle">Sign in to access the testing workspace.</p>
          </div>
        </div>

        <form method="post" action="/auth/login" autocomplete="on">
          <label>
            Username
            <input name="username" type="text" autocomplete="username" required autofocus />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Sign in</button>
        </form>

        <p id="invalid" class="error">Invalid username or password.</p>
        <p class="note">This is a lightweight login for the HTTP test site.</p>
      </section>
    </main>
  </body>
</html>
